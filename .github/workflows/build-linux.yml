name: Linux CMake build

on:
  push:
    branches:
      - dev
      - feature/mogram-plugin-manager-core
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Configure and build MoGram (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Pull Telegram Desktop build environment
        run: docker pull ghcr.io/telegramdesktop/tdesktop/centos_env:latest

      - name: Configure and compile
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/usr/src/tdesktop" \
            -w /usr/src/tdesktop \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID=2040 \
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mogram-linux-build
          path: out/
          if-no-files-found: error
          retention-days: 7
